# Default quality-gate package (org standard PR quality/security).
# Metrics jobs load this file — do not wire one-off scanners in callers.
#
# Engines produce findings → schemas/finding.schema.json → quality-gate.yml policy.
# Semgrep packs cover language SAST + GitHub Actions (e.g. pin actions to full SHA).

name: default
description: >
  Standard PR quality package: security SAST, Actions hygiene, duplication,
  complexity, and changed-file coverage.

engines:
  # Static analysis + workflow hygiene (includes unpinned Actions / mutable refs)
  semgrep:
    enabled: true
    language_packs: true
    always_packs:
      - p/security-audit
      - p/github-actions
    # Extra Semgrep rules shipped with this package (repo-relative)
    local_rules:
      - config/packages/default/rules

  duplication:
    enabled: true
    engine: jscpd

  complexity:
    enabled: true
    engine: lizard
    threshold: 15

  coverage:
    enabled: true
    threshold_pct: 80
    # lcov / cobertura / istanbul discovered from checks artifacts
