# Part of package "default" — catch dynamic code execution (Sonar hotspot S1523 parity).
# Registry packs (p/javascript, p/security-audit) often miss plain TypeScript eval().
rules:
  - id: agentic.ts.security.eval-injection
    message: >
      Make sure that this dynamic injection or execution of code is safe.
      Dynamically executing code (eval / Function) is a security hotspot —
      untrusted input can lead to remote code execution (RCE).
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security
      cwe:
        - "CWE-95"
      owasp:
        - "A03:2021 - Injection"
      references:
        - https://owasp.org/www-community/attacks/Code_Injection
      technology:
        - javascript
        - typescript
      likelihood: HIGH
      impact: HIGH
      agentic_fix: |
        Prefer a safe alternative instead of eval:
        - JSON data → JSON.parse
        - math expressions → a vetted expression library
        - dynamic dispatch → a whitelist map of functions
        Never pass user/request/query input into eval or new Function().
    pattern-either:
      - pattern: eval($X)
      - pattern: new Function(...)
      - pattern: Function(...)

  - id: agentic.ts.security.nonliteral-regexp
    message: >
      RegExp built from a non-literal pattern can enable ReDoS if the pattern
      comes from user input. Validate or allow-list patterns before compiling.
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: security
      cwe:
        - "CWE-1333"
      technology:
        - javascript
        - typescript
      likelihood: MEDIUM
      impact: MEDIUM
      agentic_fix: |
        Prefer a literal RegExp (/pattern/) or compile only from an allow-listed
        set of patterns. If dynamic patterns are required, bound length and
        reject nested quantifiers from untrusted input.
    patterns:
      - pattern: new RegExp($PATTERN, ...)
      - pattern-not: new RegExp("...", ...)
      - pattern-not: new RegExp('...', ...)
      - pattern-not: new RegExp(`...`, ...)
