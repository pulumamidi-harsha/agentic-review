# Package "default" — denser JS/TS security hotspots (Sonar-parity set).
# Kept as local rules so CI still finds them when registry packs 404 / miss.
rules:
  # --- Secrets -----------------------------------------------------------------
  - id: agentic.ts.security.hardcoded-secret
    message: >
      Hardcoded credential-like value detected. Secrets in source leak via git
      history, forks, and CI logs — use env vars or a secret manager.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-798"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      likelihood: HIGH
      impact: HIGH
      agentic_fix: |
        (1) Move the value to an environment variable or secret store
        (2) Read it at runtime (process.env / your secrets client)
        (3) Rotate the exposed credential and scrub git history if it was real
    pattern-either:
      - patterns:
          - pattern: |
              $KEY = "$VAL"
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i).*(password|passwd|secret|api[_-]?key|access[_-]?token|auth[_-]?token|private[_-]?key).*
          - metavariable-regex:
              metavariable: $VAL
              regex: (?!change.?me|xxx|todo|placeholder|your[_-]?|example|dummy).{10,}
      - patterns:
          - pattern: |
              $KEY: "$VAL"
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i).*(password|passwd|secret|api[_-]?key|access[_-]?token|auth[_-]?token|private[_-]?key).*
          - metavariable-regex:
              metavariable: $VAL
              regex: (?!change.?me|xxx|todo|placeholder|your[_-]?|example|dummy).{10,}
      - pattern-regex: (?i)(sk-live-|sk-test-|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,})

  # --- XSS --------------------------------------------------------------------
  - id: agentic.ts.security.xss-innerhtml
    message: >
      Assigning to innerHTML / outerHTML with untrusted data enables XSS.
      Prefer textContent or a sanitized HTML pipeline.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-79"]
      owasp: ["A03:2021 - Injection"]
      likelihood: HIGH
      impact: HIGH
      agentic_fix: |
        (1) Prefer element.textContent = value for plain text
        (2) If HTML is required, sanitize with a vetted library (DOMPurify)
        (3) Never concatenate user/request input into HTML strings
    pattern-either:
      - pattern: $EL.innerHTML = $HTML
      - pattern: $EL.outerHTML = $HTML
      - pattern: $EL.insertAdjacentHTML($POS, $HTML)

  - id: agentic.ts.security.xss-dangerously-set-inner-html
    message: >
      React dangerouslySetInnerHTML is an XSS hotspot. Only use with trusted,
      sanitized HTML — never raw user input.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-79"]
      owasp: ["A03:2021 - Injection"]
      likelihood: HIGH
      impact: HIGH
      agentic_fix: |
        (1) Avoid dangerouslySetInnerHTML when textContent / children work
        (2) Sanitize HTML with DOMPurify (or equivalent) before rendering
        (3) Document why the HTML must be raw and where it is sanitized
    pattern: |
      <$X dangerouslySetInnerHTML={{__html: $HTML}} ... />

  # --- Command injection ------------------------------------------------------
  - id: agentic.ts.security.command-injection
    message: >
      Shell execution with a non-literal command is a command-injection hotspot.
      Prefer execFile/spawn with an argument array — never build a shell string
      from user input.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-78"]
      owasp: ["A03:2021 - Injection"]
      likelihood: HIGH
      impact: HIGH
      agentic_fix: |
        (1) Replace exec/execSync(string) with execFile/spawn + args array
        (2) Allow-list the binary and validate every argument
        (3) Never pass request/query/AI output into a shell string
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
              - pattern: child_process.exec($CMD, ...)
              - pattern: child_process.execSync($CMD, ...)
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
          - pattern-not: exec("...", ...)
          - pattern-not: exec('...', ...)
          - pattern-not: execSync("...", ...)
          - pattern-not: execSync('...', ...)
          - pattern-not: child_process.exec("...", ...)
          - pattern-not: child_process.execSync("...", ...)

  # --- Insecure crypto --------------------------------------------------------
  - id: agentic.ts.security.insecure-hash
    message: >
      MD5 / SHA-1 are weak for security-sensitive hashing (passwords, tokens,
      integrity). Use SHA-256+ or a password KDF (bcrypt / scrypt / argon2).
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-328"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      likelihood: MEDIUM
      impact: MEDIUM
      agentic_fix: |
        (1) For integrity: crypto.createHash('sha256')
        (2) For passwords: bcrypt / scrypt / argon2 — never raw MD5/SHA-1
        (3) Keep salts / iterations appropriate for your threat model
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")
      - pattern: crypto.createHash('md5')
      - pattern: crypto.createHash('sha1')
      - pattern: createHash("md5")
      - pattern: createHash("sha1")
      - pattern: createHash('md5')
      - pattern: createHash('sha1')

  # --- document.write ---------------------------------------------------------
  - id: agentic.ts.security.document-write
    message: >
      document.write can overwrite the page and enable XSS when fed untrusted
      strings. Prefer DOM APIs (createElement / textContent).
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-79"]
      owasp: ["A03:2021 - Injection"]
      likelihood: MEDIUM
      impact: MEDIUM
      agentic_fix: |
        (1) Replace document.write with createElement + textContent/append
        (2) Never pass user input into document.write
    pattern-either:
      - pattern: document.write($X)
      - pattern: document.writeln($X)
