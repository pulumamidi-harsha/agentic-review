# Part of package "default" — pin GitHub Actions / reusable workflows to full SHAs.
# Pin rule (was often flagged by Sonar/IDEs): "Use full commit SHA hash for this dependency."
rules:
  - id: agentic.gha.unpinned-ref
    message: >
      Pin GitHub Actions and reusable workflows to a full 40-character commit SHA.
      Mutable refs (@main, @master, @v1, @v4) can change without a PR update.
    languages: [yaml]
    severity: WARNING
    metadata:
      category: security
      technology: [github-actions]
      likelihood: MEDIUM
      impact: MEDIUM
    paths:
      include:
        - "**/.github/workflows/**"
        - "**/.github/actions/**"
    pattern-regex: (?m)^\s*uses:\s*['\"]?[^'\"\s#]+@(main|master|develop|head|latest|v\d+(?:\.\d+)*)['\"]?\s*(?:#.*)?$
