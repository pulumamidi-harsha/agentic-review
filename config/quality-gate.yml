# Org quality gate — replaces SonarQube for this pipeline.
# Policy (mode / fail_if / warn_if) lives here.
# What to scan lives in config/packages/<package>.yml (engines + Semgrep packs).
#
# Override mode without forking: AGENTIC_GATE_MODE=advisory|soft_fail|hard_fail

version: 1
package: default
mode: advisory

on_pull_request:
  min_new_lines_for_coverage_dup: 20

  fail_if:
    - new_secrets: true
    - new_findings_severity: [error]

  warn_if:
    - new_duplication_blocks: "> 0"
    - changed_file_coverage_pct: "< 80"
    - complexity_increase: "> 15"
