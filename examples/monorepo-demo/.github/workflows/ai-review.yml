# AI PR Review — monorepo demo (Node + Python + Terraform)
# Points at Phase 1 metrics branch for pilot testing.
name: AI PR Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    uses: bayer-int/agentic-review/.github/workflows/ai-review.yml@phase-1-metrics-semgrep
    with:
      review_type: quick
      pipeline_repository: bayer-int/agentic-review
      pipeline_ref: phase-1-metrics-semgrep
    secrets:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_API_ENDPOINT: ${{ secrets.AI_API_ENDPOINT }}
      ORG_PAT: ${{ secrets.ORG_PAT || github.token }}
