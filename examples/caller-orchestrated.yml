# Prefer this over caller-workflow.yml when using the three-hub pipeline.
# Full file: see agentic-verdict/examples/caller-orchestrated.yml
name: Agentic PR Pipeline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-phase1:
    uses: pulumamidi-harsha/agentic-review/.github/workflows/ai-review-phase1.yml@main
    with:
      pipeline_repository: pulumamidi-harsha/agentic-review
      pipeline_ref: main
    secrets:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_API_ENDPOINT: ${{ secrets.AI_API_ENDPOINT }}
      ORG_PAT: ${{ secrets.ORG_PAT }}

  quality-gate:
    needs: ai-phase1
    if: always() && needs.ai-phase1.result == 'success'
    uses: pulumamidi-harsha/agentic-quality-gate/.github/workflows/quality-gate.yml@main
    with:
      pipeline_repository: pulumamidi-harsha/agentic-quality-gate
      pipeline_ref: main
      coverage_artifact: agentic-coverage
    secrets:
      ORG_PAT: ${{ secrets.ORG_PAT }}

  ai-verdict:
    needs: [ai-phase1, quality-gate]
    if: always() && needs.ai-phase1.result == 'success'
    uses: pulumamidi-harsha/agentic-verdict/.github/workflows/ai-verdict.yml@main
    with:
      pipeline_repository: pulumamidi-harsha/agentic-verdict
      pipeline_ref: main
      pr_size: ${{ needs.ai-phase1.outputs.pr_size }}
      diff_lines: ${{ needs.ai-phase1.outputs.diff_lines }}
      changed_files: ${{ needs.ai-phase1.outputs.changed_files }}
      pr_scope: ${{ needs.ai-phase1.outputs.pr_scope }}
      checks_passed: ${{ needs.ai-phase1.outputs.checks_passed }}
      checks_failed: ${{ needs.ai-phase1.outputs.checks_failed }}
      checks_exit: ${{ needs.ai-phase1.outputs.checks_exit }}
      setup_failed: ${{ needs.ai-phase1.outputs.setup_failed }}
      security_exit: ${{ needs.ai-phase1.outputs.security_exit }}
      quality_gate_artifact: agentic-metrics
    secrets:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_API_ENDPOINT: ${{ secrets.AI_API_ENDPOINT }}
      ORG_PAT: ${{ secrets.ORG_PAT }}
