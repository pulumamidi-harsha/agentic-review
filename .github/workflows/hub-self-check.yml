# Dogfood AI hub scripts (no quality-gate / Sonar metrics here).
name: Hub self-check

on:
  pull_request:
    branches: [main, harsha]
  push:
    branches: [main, harsha]

permissions:
  contents: read

jobs:
  self-check:
    name: AI scripts syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check (AI pipeline)
        run: |
          set -euo pipefail
          files=(
            scripts/common.sh
            scripts/gather-context.sh
            scripts/ai-pass1.sh
            scripts/ai-pass2.sh
            scripts/call-llm.sh
            scripts/run-checks.sh
            scripts/run-security.sh
            scripts/run-docker.sh
            scripts/run-dep-audit.sh
            scripts/filter-pr-diff.sh
            scripts/load-config.sh
            scripts/validate-payload.sh
          )
          for f in "${files[@]}"; do
            bash -n "$f"
            echo "OK bash -n $f"
          done

      - name: Node syntax (post-review)
        run: |
          node --check scripts/post-review.js
          echo "OK post-review.js"
